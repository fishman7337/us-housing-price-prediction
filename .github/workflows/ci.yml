name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: >
          python -m pytest
          --cov=us_housing_price_prediction
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=75

      - name: Validate data
        run: python -m us_housing_price_prediction validate-data

      - name: Train smoke test
        run: >
          python -m us_housing_price_prediction train
          --model-path models/ci-housing-price-regressor.joblib
          --metrics-path reports/ci-metrics.json
          --min-r2 0.45

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Static security scan
        run: python -m bandit -r src -c pyproject.toml

      - name: Dependency vulnerability scan
        run: python -m pip_audit -r requirements.txt
