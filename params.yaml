random_state: 42
test_size: 0.2
cross_validation_splits: 5
quality_gates:
  min_test_r2: 0.45
features:
  drop_source_features_after_engineering: true
model:
  voting_regressor:
    ridge_alpha: 10.0
    random_forest_estimators: 160
    random_forest_min_samples_leaf: 2
    gradient_boosting_estimators: 160
    gradient_boosting_learning_rate: 0.05
    gradient_boosting_max_depth: 3
